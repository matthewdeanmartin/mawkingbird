name: Publish Native installers

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  preflight:
    if: startsWith(github.event.release.tag_name, 'native-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check reviewed Native release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/check-native-release.mjs
      - name: Check bundle icons
        run: node native/scripts/check-bundle-icons.mjs

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/src-tauri -> target
          key: ${{ matrix.os }}-${{ runner.arch }}-release
          cache-workspace-crates: 'false'
      - name: Install shared frontend dependencies
        run: npm ci --prefix ui
      - name: Build reviewed frontend
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/build-native-frontend.mjs
      - name: Package unsigned desktop application
        working-directory: native
        run: npx --yes @tauri-apps/cli@2.12.4 build --config '{"bundle":{"active":true}}' -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mawkingbird-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/src-tauri/target/release/bundle/deb/*.deb
            native/src-tauri/target/release/bundle/rpm/*.rpm
            native/src-tauri/target/release/bundle/appimage/*.AppImage
            native/src-tauri/target/release/bundle/dmg/*.dmg
            native/src-tauri/target/release/bundle/msi/*.msi
            native/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  attach:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mawkingbird-native-*
          path: dist
      - name: Attach installers to the reviewed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0)
          (( ${#assets[@]} >= 3 )) || { echo 'Expected installers from all three platforms' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
