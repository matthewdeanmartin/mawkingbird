name: Publish Native installers

on:
  release:
    types: [published]

concurrency: native-publish-${{ github.event.release.tag_name }}

permissions:
  contents: read

jobs:
  preflight:
    if: startsWith(github.event.release.tag_name, 'native-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Prepare release bookkeeping from the published source snapshot
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: node .github/scripts/prepare-native-release.mjs
      - name: Save the exact version/changelog overlay for every build and the PR
        run: tar -cf native-release-metadata.tar NATIVE_CHANGELOG.md native/src-tauri/tauri.conf.json native/src-tauri/Cargo.toml native/src-tauri/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-metadata
          path: native-release-metadata.tar
          retention-days: 90
      - name: Check reviewed Native release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/check-native-release.mjs
      - name: Check bundle icons
        run: node native/scripts/check-bundle-icons.mjs

  build:
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-metadata
      - name: Apply automation-owned release metadata
        shell: bash
        run: tar -xf native-release-metadata.tar
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/src-tauri -> target
          key: ${{ matrix.os }}-${{ runner.arch }}-release
          cache-workspace-crates: 'false'
      - name: Install shared frontend dependencies
        run: npm ci --prefix ui
      - name: Build reviewed frontend
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/build-native-frontend.mjs
      - name: Package unsigned desktop application
        working-directory: native
        run: npx --yes @tauri-apps/cli@2.12.4 build --config '{"bundle":{"active":true}}' -- --locked
      - name: Attest installer build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            native/src-tauri/target/release/bundle/deb/*.deb
            native/src-tauri/target/release/bundle/rpm/*.rpm
            native/src-tauri/target/release/bundle/appimage/*.AppImage
            native/src-tauri/target/release/bundle/dmg/*.dmg
            native/src-tauri/target/release/bundle/msi/*.msi
            native/src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mawkingbird-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/src-tauri/target/release/bundle/deb/*.deb
            native/src-tauri/target/release/bundle/rpm/*.rpm
            native/src-tauri/target/release/bundle/appimage/*.AppImage
            native/src-tauri/target/release/bundle/dmg/*.dmg
            native/src-tauri/target/release/bundle/msi/*.msi
            native/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  attach:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-metadata
      - name: Apply automation-owned release metadata
        shell: bash
        run: tar -xf native-release-metadata.tar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mawkingbird-native-*
          path: dist
      - name: Collect Native application dependency manifests
        run: |
          mkdir -p sbom-input/ui sbom-input/native/src-tauri
          cp ui/package.json ui/package-lock.json sbom-input/ui/
          cp native/src-tauri/Cargo.toml native/src-tauri/Cargo.lock sbom-input/native/src-tauri/
      - name: Generate Native dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./sbom-input
          format: spdx-json
          output-file: mawkingbird-native-dependencies.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check Native dependency SBOM
        run: |
          jq -e '.spdxVersion == "SPDX-2.3" and
            any(.packages[]; .name == "@angular/core") and
            any(.packages[]; .name == "tauri")' mawkingbird-native-dependencies.spdx.json
      - name: Attest installer SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/**/*
          sbom-path: mawkingbird-native-dependencies.spdx.json
      - name: Attach installers to the reviewed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0)
          (( ${#assets[@]} >= 3 )) || { echo 'Expected installers from all three platforms' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${assets[@]}" mawkingbird-native-dependencies.spdx.json native-release-metadata.tar --clobber

  bookkeeping:
    needs: preflight
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-metadata
      - name: Apply automation-owned release metadata
        shell: bash
        run: tar -xf native-release-metadata.tar
      - name: Open automation bookkeeping PR without moving the published tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo '::warning::Bookkeeping branch already exists; leaving it intact and retrying PR creation.'
          else
            git switch -c "$branch"
            git add NATIVE_CHANGELOG.md native/src-tauri/tauri.conf.json native/src-tauri/Cargo.toml native/src-tauri/Cargo.lock
            if ! git diff --cached --quiet; then git commit -m "chore: record $RELEASE_TAG [skip ci]"; fi
            git -c credential.helper='!gh auth git-credential' push origin "$branch"
          fi
          uvx --no-build --from keepachangelog-manager-fork==6.10.1 kaclm --component native github-pr             --repository "$GITHUB_REPOSITORY" --head "$branch" --base main             --title "chore: record $RELEASE_TAG"             --body 'Records the exact version and changelog overlay used by the published installers. Merge when convenient; the next local source deployment synchronizes the released version back to the private checkout. The original release tag stays unchanged.'
      - name: Explain bookkeeping failure
        if: failure()
        run: |
          echo '::warning::RELEASE BOOKKEEPING PR FAILED. Installer builds proceed independently. Review this job and merge/reconcile bookkeeping before the next release. Do not delete or move the published tag; a fresh version number is fine.'
          echo '## WARNING: release bookkeeping needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'Installers may still succeed. Repair the PR separately; do not undo the published release.' >> "$GITHUB_STEP_SUMMARY"
