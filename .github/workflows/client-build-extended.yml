name: Validate client builds (full)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subpath-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base: ["/canary/", "/test/", "/mawkingbird/", "/mawkingbird/canary/"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build standalone client
        env:
          BASE_HREF: ${{ matrix.base }}
        run: make mockingbird MOCKINGBIRD_BASE_HREF="$BASE_HREF"
  design-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run design:inventory-check
      - run: npx playwright install --with-deps chromium
      - run: npm run design:build
      - run: npm run design:browser -- --shard=${{ matrix.shard }}/2
