name: Create Native Draft Release

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "ui/**"
      - "NATIVE_CHANGELOG.md"
      - "changelogmanager.toml"
      - ".github/workflows/native-draft-release.yml"
  workflow_dispatch:

concurrency: native-draft-release

permissions:
  contents: write

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate Native changelog
        run: uvx --from keepachangelog-manager-fork==6.10.1 kaclm --component native validate
      - name: Create or update Native draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./native/src-tauri/tauri.conf.json').version")
          RELEASE_TAG="native-v${VERSION}" node .github/scripts/check-native-release.mjs
          uvx --from keepachangelog-manager-fork==6.10.1 kaclm --component native github-release \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --draft
