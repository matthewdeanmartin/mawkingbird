# Source and custom-domain Pages host: mawkingbird.
---
name: Deploy Mawkingbird Canary and Test
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.MAWKINGBIRD_PUBLISH_ENABLED == 'true' }}
    name: Build and stage Canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Stamp build info
        run: node ui/scripts/gen-build-info.mjs
      - name: Build Canary
        run: make mockingbird MOCKINGBIRD_BASE_HREF=/canary/
      - name: Stamp Canary Bluesky OAuth metadata
        run: node ui/scripts/write-bluesky-oauth-metadata.mjs ui/dist-mockingbird/browser https://mawkingbird.com/canary/
      - name: Add canary marker
        run: printf '%s\n' "$GITHUB_SHA" > ui/dist-mockingbird/browser/canary-commit.txt
      - name: Publish /canary/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-gh-pages.sh canary ui/dist-mockingbird/browser
  test-deployment:
    if: ${{ vars.MAWKINGBIRD_PUBLISH_ENABLED == 'true' }}
    name: Build and deploy /test/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Stamp build info
        run: node ui/scripts/gen-build-info.mjs
      - name: Build /test/
        run: make mockingbird MOCKINGBIRD_BASE_HREF=/test/
      - name: Stamp test Bluesky OAuth metadata
        run: node ui/scripts/write-bluesky-oauth-metadata.mjs ui/dist-mockingbird/browser https://mawkingbird.com/test/
      - name: Add test marker
        run: printf '%s\n' "$GITHUB_SHA" > ui/dist-mockingbird/browser/test-commit.txt
      - name: Verify this really is a test build
        run: |
          grep --fixed-strings '<base href="/test/"/>' ui/dist-mockingbird/browser/index.html
          test ! -e ui/dist-mockingbird/browser/CNAME
      - name: Publish /test/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-gh-pages.sh test ui/dist-mockingbird/browser
      # Deploy the complete site once, after both preview subtrees are staged.
      # The branch holds the manually promoted production files as well.
      - name: Check out assembled site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .pages-site
          persist-credentials: false
      - name: Verify complete site
        run: |
          test -f .pages-site/index.html
          test -f .pages-site/canary/index.html
          test -f .pages-site/test/index.html
          grep --fixed-strings '<base href="/"/>' .pages-site/index.html
          test "$(cat .pages-site/CNAME)" = mawkingbird.com
          test "$(cat .pages-site/canary/canary-commit.txt)" = "$GITHUB_SHA"
          test "$(cat .pages-site/test/test-commit.txt)" = "$GITHUB_SHA"
      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-site
      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
