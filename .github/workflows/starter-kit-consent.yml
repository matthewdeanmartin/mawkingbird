---
name: Starter-kit consent
on:
  schedule:
    # Re-check home-instance indexing preferences on the first Sunday of every month.
    - cron: 0 11 1-7 * 0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revalidate:
    name: Revalidate bundled starter kits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check indexing consent and account resolution
        run: node ui/scripts/update-bundled-starter-kits.mjs --check
