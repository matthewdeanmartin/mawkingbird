---
name: Starter-kit consent
on:
  schedule:
    # Re-check home-instance indexing preferences on the first Sunday of every month.
    - cron: 0 11 1-7 * 0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revalidate:
    name: Revalidate bundled starter kits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Check indexing consent and account resolution
        run: node ui/scripts/update-bundled-starter-kits.mjs --check
