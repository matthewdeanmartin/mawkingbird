name: Validate client builds
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        base: ['/', '/canary/', '/test/', '/mawkingbird/', '/mawkingbird/canary/']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build standalone client
        env:
          BASE_HREF: ${{ matrix.base }}
        run: make mockingbird MOCKINGBIRD_BASE_HREF="$BASE_HREF"
      - name: Check deployment contracts
        working-directory: ui
        run: |
          npm run check:subpaths
          npm run check:storage
          node --test scripts/import-starter-catalog.test.mjs

  help-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make help-site-test
      - run: make help-site HELP_OUT=.help-site

  design-system-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run design:verify -- --shard=${{ matrix.shard }}/2

  # Preserve the required check name and require every shard to pass.
  design-system:
    if: ${{ always() }}
    needs: design-system-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require all design shards
        env:
          SHARD_RESULT: ${{ needs.design-system-shards.result }}
        run: test "$SHARD_RESULT" = success
