name: Validate client builds
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        base: ['/', '/canary/', '/test/', '/mawkingbird/', '/mawkingbird/canary/']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build standalone client
        env:
          BASE_HREF: ${{ matrix.base }}
        run: make mockingbird MOCKINGBIRD_BASE_HREF="$BASE_HREF"
      - name: Check deployment contracts
        working-directory: ui
        run: |
          npm run check:subpaths
          npm run check:storage
          node --test scripts/import-starter-catalog.test.mjs
