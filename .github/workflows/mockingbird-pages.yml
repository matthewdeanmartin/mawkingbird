# Source and custom-domain Pages host: mawkingbird.
---
name: Deploy Mawkingbird production
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish (branch, tag, or commit SHA)
        required: true
        default: main
        type: string
concurrency:
  group: gh-pages-branch
  cancel-in-progress: false
jobs:
  build:
    if: ${{ vars.MAWKINGBIRD_PUBLISH_ENABLED == 'true' }}
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      CUSTOM_DOMAIN: mawkingbird.com
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Stamp build info
        run: node ui/scripts/gen-build-info.mjs
      - name: Build Mocking Bird
        run: make mockingbird MOCKINGBIRD_BASE_HREF=/
      - name: Stamp Bluesky OAuth metadata
        run: node ui/scripts/write-bluesky-oauth-metadata.mjs ui/dist-mockingbird/browser https://mawkingbird.com/
      - name: Add SPA 404 fallback
        run: cp ui/dist-mockingbird/browser/404-subpath-redirect.html ui/dist-mockingbird/browser/404.html
      - name: Add custom domain
        run: printf '%s' "$CUSTOM_DOMAIN" > ui/dist-mockingbird/browser/CNAME
      - name: Verify production layout
        run: |
          grep --fixed-strings '<base href="/"/>' ui/dist-mockingbird/browser/index.html
          grep --fixed-strings "var SITE_BASE = '/';" ui/dist-mockingbird/browser/404.html
          node -e "const m = require('./ui/dist-mockingbird/browser/oauth-client-metadata.json'); if (m.client_id !== 'https://mawkingbird.com/oauth-client-metadata.json') process.exit(1)"
      - name: Publish production to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-gh-pages.sh root ui/dist-mockingbird/browser
      # Production changes the root while preserving the preview subtrees.
      - name: Check out assembled site
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: .pages-site
          persist-credentials: false
      - name: Verify complete site
        run: |
          test -f .pages-site/canary/index.html
          test -f .pages-site/test/index.html
          grep --fixed-strings '<base href="/"/>' .pages-site/index.html
          test "$(cat .pages-site/CNAME)" = "$CUSTOM_DOMAIN"
      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-site
      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
