    <!--
      Content-Security-Policy. This app is served as static files with no
      backend we control, so the policy ships as a meta tag; see
      docs/security.md for the header-only directives (frame-ancestors) that a
      host which *can* set headers should add on top.

      script-src is the directive that matters here. Everything this app holds —
      Mastodon bearer tokens, Bluesky JWTs, connector tokens — lives in this
      origin's localStorage, so any script that runs here can read all of it.
      The allowlist is therefore exactly 'self' and nothing else: no third-party
      origin can execute here, so no third party — and no future owner of a
      third party's expired domain — can read any of it. Analytics is served
      from our own origin (public/vendor/count.js, refreshed at build time by
      scripts/vendor-analytics.mjs) for precisely that reason.

      There is also deliberately no 'unsafe-inline' and no 'unsafe-eval': the
      scripts that used to be inline in this file now live in boot.js.

      style-src needs 'unsafe-inline' because Angular injects component styles
      as <style> elements at runtime; removing it requires a per-response nonce,
      which a static host cannot generate.

      connect-src / img-src are deliberately wide: the user points this client
      at an arbitrary Mastodon instance and subscribes to arbitrary RSS feeds,
      so the hosts cannot be enumerated in advance. http: and ws: are allowed so
      a localhost instance still works during development.

      External playback is confined to allowlisted cross-origin iframes
      below, created only after the user loads a player. No provider SDK executes in
      our document; script-src remains self-only.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: http:;
        font-src 'self' data:;
        connect-src 'self' https: http: ws: wss:;
        media-src 'self' data: blob: https: http:;
        worker-src 'self' blob:;
        manifest-src 'self';
        form-action 'self';
        base-uri 'self';
        object-src 'none';
        frame-src https://www.youtube-nocookie.com https://w.soundcloud.com https://player-widget.mixcloud.com https://open.spotify.com https://embed.music.apple.com https://embed.podcasts.apple.com https://embed.tidal.com https://bandcamp.com https://audio.com https://music.amazon.com https://widget.deezer.com https://archive.org;
      "/>

    <meta name="referrer" content="strict-origin-when-cross-origin"/>
