<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mawkingbird</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Content-Security-Policy. This app is served as static files with no
      backend we control, so the policy ships as a meta tag; see
      docs/security.md for the header-only directives (frame-ancestors) that a
      host which *can* set headers should add on top.

      script-src is the directive that matters here. Everything this app holds —
      Mastodon bearer tokens, Bluesky JWTs, connector tokens — lives in this
      origin's localStorage, so any script that runs here can read all of it.
      The allowlist is therefore exactly 'self' and nothing else: no third-party
      origin can execute here, so no third party — and no future owner of a
      third party's expired domain — can read any of it. Analytics is served
      from our own origin (public/vendor/count.js, refreshed at build time by
      scripts/vendor-analytics.mjs) for precisely that reason.

      There is also deliberately no 'unsafe-inline' and no 'unsafe-eval': the
      scripts that used to be inline in this file now live in boot.js.

      style-src needs 'unsafe-inline' because Angular injects component styles
      as <style> elements at runtime; removing it requires a per-response nonce,
      which a static host cannot generate.

      connect-src / img-src are deliberately wide: the user points this client
      at an arbitrary Mastodon instance and subscribes to arbitrary RSS feeds,
      so the hosts cannot be enumerated in advance. http: and ws: are allowed so
      a localhost instance still works during development.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: http:;
        font-src 'self' data:;
        connect-src 'self' https: http: ws: wss:;
        media-src 'self' data: blob: https: http:;
        worker-src 'self' blob:;
        manifest-src 'self';
        form-action 'self';
        base-uri 'self';
        object-src 'none';
        frame-src 'none';
      "
    />

    <!--
      Outbound links go to arbitrary sites, and some in-app URLs carry content in
      the query string (/message/?m=…). Send only the origin cross-origin.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!--
      Identity verification for Mastodon. A profile field linking back to this
      site shows a green check only if this page links back with rel="me" — the
      handshake has to be mutual, which is what makes it evidence rather than a
      claim anyone could type.
    -->
    <link rel="me" href="https://mastodon.social/@mistersql" />

    <!--
      SPA deep-link restore. Must run synchronously ahead of the app bundle, so
      this is a blocking script; the src is relative so it resolves against
      <base href> (/canary/ loads its own copy).

      Analytics is deliberately NOT loaded here. analytics-tracker.ts injects it
      on the first counted page view, and only when the user has not opted out —
      so opting out means the script is never fetched or run at all.
    -->
    <script src="boot.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
