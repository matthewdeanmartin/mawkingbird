<div class="tabs">
  <button class="tab" [class.active]="!local()" (click)="setLocal(false)">
    {{ 'publicTimeline.all' | transloco }}
  </button>
  <button class="tab" [class.active]="local()" (click)="setLocal(true)">
    {{ 'publicTimeline.local' | transloco }}
  </button>
</div>

<app-command-bar [showRefresh]="!live()" (refresh)="load()" />

@if (loading()) {
  <mb-content-state
    kind="loading"
    announcement="status"
    [title]="'publicTimeline.loading' | transloco"
  />
}
@if (loadFailed()) {
  <mb-content-state kind="error" announcement="alert" [title]="'timelineState.failed' | transloco">
    <button mbButton variant="outline" type="button" (click)="load()">
      {{ 'timelineState.retry' | transloco }}
    </button>
  </mb-content-state>
}
@if (!loading() && !loadFailed() && !statuses().length) {
  <mb-content-state [title]="'publicTimeline.empty' | transloco" />
}
@for (s of statuses(); track s.id; let i = $index) {
  <app-status-card
    [status]="s"
    filterContext="public"
    (changed)="onChanged(i, $event)"
    (deleted)="onDeleted($event)"
  />
}
