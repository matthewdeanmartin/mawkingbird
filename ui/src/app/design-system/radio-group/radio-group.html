<fieldset [disabled]="disabled() || formDisabled()" (focusout)="touch($event)">
  <legend>
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true">*</span>
    }
  </legend>
  @if (hint()) {
    <p class="group-hint" [id]="groupId + '-hint'">{{ hint() }}</p>
  }
  <div class="options">
    @for (option of options(); track option.value; let i = $index) {
      <div class="choice">
        <input
          type="radio"
          [id]="groupId + '-' + i"
          [name]="groupId"
          [value]="option.value"
          [checked]="selection() === option.value"
          [disabled]="!!option.disabled"
          [required]="required()"
          [attr.aria-describedby]="descriptionIds(i)"
          [attr.aria-invalid]="error() ? 'true' : null"
          (change)="choose(option.value)"
        />
        <div class="copy">
          <label [for]="groupId + '-' + i">{{ option.label }}</label>
          @if (option.hint) {
            <p [id]="groupId + '-' + i + '-hint'">{{ option.hint }}</p>
          }
        </div>
      </div>
    }
  </div>
  <mb-save-feedback state="error" [message]="error()" [errorId]="groupId + '-error'" />
</fieldset>
