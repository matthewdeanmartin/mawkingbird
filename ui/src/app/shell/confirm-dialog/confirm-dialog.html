<mb-dialog
  [title]="title()"
  [description]="message()"
  [closeLabel]="'confirm.cancel' | transloco"
  dialogRole="alertdialog"
  [showClose]="false"
  [closeOnBackdrop]="true"
  (dismissed)="cancelled.emit()"
>
  @if (mode() === 'prompt') {
    <mb-field [label]="inputLabel()">
      <input
        mbControl
        type="text"
        [value]="value()"
        (input)="value.set($any($event.target).value)"
        (keydown.enter)="$event.preventDefault(); $event.stopPropagation(); confirmed.emit()"
      />
    </mb-field>
  }
  <ng-container mbDialogActions>
    @if (mode() !== 'alert') {
      <button mbButton variant="outline" type="button" (click)="cancelled.emit()">
        {{ 'confirm.cancel' | transloco }}
      </button>
    }
    @if (danger()) {
      <button mbButton tone="danger" type="button" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    } @else {
      <button mbButton type="button" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
    }
  </ng-container>
</mb-dialog>
