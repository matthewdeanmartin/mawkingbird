<mb-dialog
  [title]="'bugReport.title' | transloco"
  [description]="'bugReport.intro' | transloco"
  [closeLabel]="'bugReport.close' | transloco"
  [showClose]="false"
  [closeOnBackdrop]="true"
  (dismissed)="closed.emit()"
>
  <div class="report-fields">
    <mb-field [label]="'bugReport.whatHappened' | transloco">
      <textarea
        mbControl
        rows="4"
        [placeholder]="'bugReport.descriptionPlaceholder' | transloco"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
      ></textarea>
    </mb-field>
    @if (hasErrors()) {
      <mb-checkbox
        [label]="
          (errorLog.entries().length === 1
            ? 'bugReport.includeErrors.one'
            : 'bugReport.includeErrors.other'
          ) | transloco: { count: errorLog.entries().length }
        "
        [checked]="includeErrors()"
        (checkedChange)="includeErrors.set($event)"
      />
    }
    @if (hasDiagnostics()) {
      <mb-checkbox
        [label]="'bugReport.includeDiagnostics' | transloco"
        [checked]="includeDiagnostics()"
        (checkedChange)="includeDiagnostics.set($event)"
      />
    }
    <mb-disclosure
      [label]="(showDetails() ? 'bugReport.toggle.hide' : 'bugReport.toggle.show') | transloco"
      [expanded]="showDetails()"
      (expandedChange)="showDetails.set($event)"
    >
      <pre class="preview">{{ preview() }}</pre>
    </mb-disclosure>
  </div>
  <button mbDialogActions mbButton variant="outline" type="button" (click)="closed.emit()">
    {{ 'bugReport.close' | transloco }}
  </button>
  <button mbDialogActions mbButton variant="outline" type="button" (click)="copy()">
    {{ (copied() ? 'bugReport.copied' : 'bugReport.copyReport') | transloco }}
  </button>
  <button mbDialogActions mbButton type="button" (click)="openGithub()">
    {{ 'bugReport.openGithubIssue' | transloco }}
  </button>
</mb-dialog>
