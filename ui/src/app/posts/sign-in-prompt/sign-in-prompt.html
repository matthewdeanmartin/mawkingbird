<mb-dialog
  [title]="'signInPrompt.title' | transloco: { action: action() }"
  [description]="'signInPrompt.body' | transloco"
  [closeLabel]="'signInPrompt.notNow' | transloco"
  [showClose]="false"
  [closeOnBackdrop]="true"
  (dismissed)="dismissed.emit()"
>
  <ng-container mbDialogActions>
    <button mbButton variant="outline" type="button" (click)="dismissed.emit()">
      {{ 'signInPrompt.notNow' | transloco }}
    </button>
    <a mbButton variant="outline" routerLink="/welcome-back" (click)="leaveAnonymous()">
      {{ 'signInPrompt.createAccount' | transloco }}
    </a>
    <a mbButton routerLink="/login" (click)="leaveAnonymous()">
      {{ 'signInPrompt.signIn' | transloco }}
    </a>
  </ng-container>
</mb-dialog>
