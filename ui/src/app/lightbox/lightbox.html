<div
  class="lightbox-overlay"
  (click)="onOverlayClick($event)"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
  (keydown.escape)="close()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'lightbox.viewer' | transloco"
  tabindex="-1"
  appFocusTrap
  [appFocusTrapCloseOnEscape]="false"
>
  <button
    class="lightbox-close"
    type="button"
    (click)="close()"
    [attr.aria-label]="'lightbox.close' | transloco"
  >
    ✕
  </button>

  @if (hasMultiple()) {
    <button
      class="lightbox-nav prev"
      type="button"
      (click)="prev($event)"
      [attr.aria-label]="'lightbox.previous' | transloco"
    >
      ‹
    </button>
  }

  @if (current(); as m) {
    <figure class="lightbox-figure">
      @if (videoSource(m); as video) {
        <app-video-player [source]="video" [watch]="videoWatch(video, m.id)" />
      } @else if (m.type === 'audio') {
        <audio
          [src]="safeMediaUrl(m.url)"
          controls
          preload="none"
          [attr.aria-label]="m.description || ('videoPlayer.audio' | transloco)"
        ></audio>
      } @else if (m.type === 'image') {
        <img
          class="lightbox-img"
          [src]="m.url || m.preview_url"
          [alt]="m.description || ''"
          decoding="async"
        />
      } @else {
        <a [href]="safeMediaUrl(m.url)" target="_blank" rel="noopener noreferrer">{{
          'videoPlayer.openOriginal' | transloco
        }}</a>
      }
      @if (m.description) {
        <figcaption class="lightbox-caption">{{ m.description }}</figcaption>
      } @else if (aiDescriptions()[m.id]; as generated) {
        <figcaption class="lightbox-caption">
          <span class="ai-label">{{ 'lightbox.aiCaption' | transloco }}</span>
          {{ generated }}
        </figcaption>
      }
      <div class="lightbox-tools">
        @if (
          m.type === 'image' && !m.description && !aiDescriptions()[m.id] && describer.available()
        ) {
          <button
            type="button"
            class="lightbox-tool"
            [disabled]="describingId() === m.id"
            (click)="describe(m, $event)"
          >
            {{
              (describingId() === m.id ? 'lightbox.describing' : 'lightbox.describe') | transloco
            }}
          </button>
        }
        @if (speech.supported && spokenDescription(m)) {
          <button type="button" class="lightbox-tool" (click)="toggleSpeech(m, $event)">
            {{ (isSpeaking(m) ? 'lightbox.stopReading' : 'lightbox.readDescription') | transloco }}
          </button>
        }
      </div>
      @if (describeError()) {
        <p class="lightbox-caption" role="alert">{{ describeError() }}</p>
      }
      @if (hasMultiple()) {
        <div class="lightbox-counter">{{ index() + 1 }} / {{ items().length }}</div>
      }
    </figure>
  }

  @if (hasMultiple()) {
    <button
      class="lightbox-nav next"
      type="button"
      (click)="next($event)"
      [attr.aria-label]="'lightbox.next' | transloco"
    >
      ›
    </button>
  }
</div>
