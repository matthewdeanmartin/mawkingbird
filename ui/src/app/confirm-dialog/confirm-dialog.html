<div
  class="overlay"
  role="presentation"
  tabindex="-1"
  (click)="cancelled.emit()"
  (keyup.escape)="cancelled.emit()"
>
  <div
    class="dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    [attr.aria-describedby]="message() ? 'confirm-message' : null"
    appFocusTrap
    (dismissed)="cancelled.emit()"
    (click)="$event.stopPropagation()"
    (keyup)="$event.stopPropagation()"
  >
    <h3 id="confirm-title">{{ title() }}</h3>
    @if (message()) {
      <p id="confirm-message">{{ message() }}</p>
    }
    @if (mode() === 'prompt') {
      <label for="dialog-value">{{ inputLabel() }}</label>
      <input
        id="dialog-value"
        type="text"
        [value]="value()"
        (input)="value.set($any($event.target).value)"
        (keydown.enter)="confirmed.emit()"
      />
    }
    <div class="confirm-actions">
      @if (mode() !== 'alert') {
        <button class="btn btn-outline" type="button" (click)="cancelled.emit()">
          {{ 'confirm.cancel' | transloco }}
        </button>
      }
      <button class="btn" [class.btn-danger]="danger()" type="button" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
