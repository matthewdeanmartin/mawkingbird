<!--
  No backdrop click handler and no escape binding, deliberately: the visitor
  answers with one of the buttons or not at all. See first-run-modal.ts.
-->
<div class="first-run-backdrop">
  <div class="first-run-panel">
    @if (step() === 'welcome') {
      <h2 id="first-run-title">{{ 'firstRun.welcomeTitle' | transloco }}</h2>
      <p class="first-run-pitch">{{ 'firstRun.pitch' | transloco }}</p>
      <!--
        Says out loud that the timeline behind the modal is a sample. Without
        this, three seeded follows read as "this app decided who I follow".
      -->
      <p class="first-run-note">
        {{ 'firstRun.sampleNote' | transloco }}
      </p>
      <div class="first-run-actions">
        <button type="button" class="first-run-primary" (click)="toNetwork()">
          {{ 'firstRun.logIn' | transloco }}
        </button>
        <button type="button" class="first-run-secondary" (click)="pick('anonymous')">
          {{ 'firstRun.continueAnonymous' | transloco }}
        </button>
      </div>
    } @else {
      <h2 id="first-run-title">{{ 'firstRun.accountQuestion' | transloco }}</h2>
      <p class="first-run-pitch">{{ 'firstRun.pickNetwork' | transloco }}</p>
      <div class="first-run-actions">
        <button type="button" class="first-run-network" (click)="pick('bluesky')">
          <span class="first-run-emoji" aria-hidden="true">🦋</span>
          <span class="first-run-network-text">
            <strong>{{ 'firstRun.bluesky' | transloco }}</strong>
            <small>{{ 'firstRun.blueskyHint' | transloco }}</small>
          </span>
        </button>
        <button type="button" class="first-run-network" (click)="pick('mastodon')">
          <span class="first-run-emoji" aria-hidden="true">🐘</span>
          <span class="first-run-network-text">
            <strong>{{ 'firstRun.mastodon' | transloco }}</strong>
            <small>{{ 'firstRun.mastodonHint' | transloco }}</small>
          </span>
        </button>
      </div>
      <button type="button" class="first-run-back" (click)="back()">
        {{ 'firstRun.back' | transloco }}
      </button>
    }
  </div>
</div>
