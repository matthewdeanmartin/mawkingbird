<mb-dialog
  [title]="
    targetName()
      ? ((targetKind() === 'list' ? 'bulkAdd.heading.list' : 'bulkAdd.heading.collection')
        | transloco: { name: targetName() })
      : ((targetKind() === 'list'
          ? 'bulkAdd.heading.listNoName'
          : 'bulkAdd.heading.collectionNoName'
        ) | transloco)
  "
  [closeLabel]="'common.close' | transloco"
  [showClose]="false"
  [closeOnBackdrop]="true"
  (dismissed)="closed.emit()"
>
  <mb-field [label]="'bulkAdd.dialogAria' | transloco" [hint]="'bulkAdd.instructions' | transloco">
    <textarea
      mbControl
      class="bulk-handles"
      rows="4"
      [ngModel]="handles()"
      (ngModelChange)="handles.set($event)"
      placeholder="&#64;alice, &#64;bob@example.social&#10;&#64;carol"
    ></textarea>
  </mb-field>
  @if (results().length) {
    <ul class="bulk-results small">
      @for (r of results(); track $index) {
        <li [class]="'result-' + r.status">
          <span class="result-handle">{{ r.handle }}</span>
          <span class="result-status">{{ statusLabel(r.status) }}</span>
        </li>
      }
    </ul>
  }
  <button mbDialogActions mbButton variant="outline" type="button" (click)="closed.emit()">
    {{ (results().length ? 'bulkAdd.done' : 'bulkAdd.cancel') | transloco }}
  </button>
  <button mbDialogActions mbButton type="button" [disabled]="busy() || !count()" (click)="add()">
    @if (busy()) {
      {{ 'bulkAdd.adding' | transloco }}
    } @else {
      {{
        (count() === 1 ? 'bulkAdd.addCount.one' : 'bulkAdd.addCount.other')
          | transloco: { count: count() }
      }}
    }
  </button>
</mb-dialog>
