@if (view() === 'settings') {
  <section class="page">
    <app-radio-header [heading]="'radio.tab.settings' | transloco" />
    <app-radio-settings />
  </section>
} @else {
  <section class="page">
    <app-radio-header [heading]="'radio.nowPlaying' | transloco" />
    @if (opening()) {
      <mb-content-state
        kind="loading"
        announcement="status"
        [title]="'radio.opening' | transloco"
      />
    } @else if (failed()) {
      <mb-content-state
        kind="error"
        announcement="alert"
        [title]="'radio.openFailed' | transloco"
      />
    } @else if (!player.active()) {
      <mb-content-state
        [title]="'radio.nothingPlaying' | transloco"
        [description]="'radio.nothingPlayingHint' | transloco"
      >
        <a mbButton routerLink="/singles/starter-kits">{{ 'singles.tab.starter' | transloco }}</a>
        <a mbButton variant="outline" routerLink="/singles">{{ 'singles.title' | transloco }}</a>
        <a mbButton variant="outline" routerLink="/playlists">{{
          'playlists.title' | transloco
        }}</a>
      </mb-content-state>
    }
  </section>
}
