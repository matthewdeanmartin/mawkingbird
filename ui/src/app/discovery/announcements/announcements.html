@for (a of announcements(); track a.id) {
  <div class="announcement" [class.read]="a.read">
    <button
      class="dismiss"
      [title]="'announcements.dismiss' | transloco"
      (click)="dismiss(a)"
      [attr.aria-label]="'announcements.dismiss' | transloco"
    >
      <span aria-hidden="true">✕</span>
    </button>
    <div class="label">{{ 'announcements.label' | transloco }}</div>
    <div class="content" [innerHTML]="a.content"></div>
    <div class="reactions">
      @for (r of chips(a); track r.name) {
        <button
          type="button"
          class="reaction"
          [class.on]="r.me"
          [class.unused]="!r.count"
          [attr.aria-pressed]="r.me"
          [title]="'announcements.react' | transloco: { emoji: r.name }"
          (click)="toggleReaction(a, r.name)"
        >
          @if (r.url) {
            <img class="custom-emoji" [src]="r.url" [alt]="':' + r.name + ':'" />
          } @else {
            <span>{{ r.name }}</span>
          }
          <span class="count">{{ r.count }}</span>
        </button>
      }
    </div>
  </div>
}
