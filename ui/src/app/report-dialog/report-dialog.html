<div class="overlay" role="presentation" (click)="closed.emit()">
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="report-title"
    appFocusTrap
    (dismissed)="closed.emit()"
    (click)="$event.stopPropagation()"
  >
    <h3 id="report-title">{{ 'report.title' | transloco: { username: username() } }}</h3>
    @if (statusId()) {
      <p class="muted small">{{ 'report.specificPost' | transloco }}</p>
    }
    <p class="muted small">
      {{ 'report.review' | transloco }}
    </p>
    @if (provider() === 'bluesky') {
      <p class="muted small">{{ 'report.blueskyService' | transloco }}</p>
    }

    <label class="field">
      {{ 'report.category' | transloco }}
      <select [ngModel]="category()" (ngModelChange)="category.set($event)">
        @for (c of categories; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </label>

    <label class="field">
      {{ 'report.comment' | transloco }}
      <textarea
        rows="3"
        [ngModel]="comment()"
        (ngModelChange)="comment.set($event)"
        [placeholder]="'report.placeholder' | transloco"
      ></textarea>
    </label>

    @if (error()) {
      <p class="report-error" role="alert">{{ error() }}</p>
    }

    <div class="dialog-actions">
      <button class="btn btn-outline" (click)="closed.emit()">
        {{ 'report.cancel' | transloco }}
      </button>
      <button class="btn warn" [disabled]="submitting()" (click)="submit()">
        {{ submitting() ? ('report.sending' | transloco) : ('report.confirm' | transloco) }}
      </button>
    </div>
  </div>
</div>
