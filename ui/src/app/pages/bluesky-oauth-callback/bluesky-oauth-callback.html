<main class="oauth-wrap">
  <section class="oauth-card" aria-live="polite">
    <span class="oauth-badge" aria-hidden="true">🦋</span>
    @if (error(); as message) {
      <h1>{{ 'blueskyOauth.errorTitle' | transloco }}</h1>
      <p class="oauth-error" role="alert">{{ message }}</p>
      <a mbButton class="oauth-button" [routerLink]="backLink">{{ backLabel | transloco }}</a>
    } @else {
      <h1>{{ 'blueskyOauth.finishing' | transloco }}</h1>
      <p>{{ 'blueskyOauth.exchange' | transloco }}</p>
    }
  </section>
</main>
