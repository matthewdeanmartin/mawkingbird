<div class="spage-head">
  <h1>{{ 'settings.anonymous.title' | transloco }}</h1>
  <p>{{ 'settings.anonymous.intro' | transloco }}</p>
</div>

<section class="anonymous-setting">
  <label for="followed-post-max-age"
    ><strong>{{ 'settings.anonymous.maxAge' | transloco }}</strong></label
  >
  <p class="muted small">{{ 'settings.anonymous.maxAge.hint' | transloco }}</p>
  <select
    id="followed-post-max-age"
    [ngModel]="prefs.followedPostMaxAgeDays()"
    (ngModelChange)="setMaximumAge($event)"
  >
    @for (option of ageOptions; track option.days) {
      <option [ngValue]="option.days">{{ option.key | transloco }}</option>
    }
  </select>
</section>
