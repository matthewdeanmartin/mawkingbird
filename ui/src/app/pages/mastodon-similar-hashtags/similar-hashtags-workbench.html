<form class="finder" (submit)="find($event)">
  <mb-field
    [label]="'focusedTools.similar.label' | transloco"
    [hint]="'focusedTools.similar.hint' | transloco: { max: maxSeeds }"
  >
    <input
      mbControl
      type="text"
      name="tags"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
    />
  </mb-field>
  <button mbButton type="submit" [disabled]="!canFind()">
    {{ 'focusedTools.similar.find' | transloco }}
  </button>
</form>

@if (tags().length) {
  <div class="panel">
    <app-similar-hashtags-panel [tags]="tags()" (tagsChange)="show($event)" />
  </div>
  <app-focused-next-steps [lead]="nextStep()" [inviteLink]="inviteLink()" />
}
