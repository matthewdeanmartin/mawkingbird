<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mawkingbird for Firefox</title>
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <form id="form">
      <fieldset>
        <legend>Which Mawkingbird to open</legend>
        <label><input type="radio" name="base" value="production" /> mawkingbird.com</label>
        <label><input type="radio" name="base" value="canary" /> Canary (mawkingbird.com/canary/)</label>
        <label><input type="radio" name="base" value="test" /> Test (mawkingbird.com/test/)</label>
        <label>
          <input type="radio" name="base" value="custom" /> Another address
          <input type="url" id="custom" placeholder="http://localhost:4200/" aria-label="Address" />
        </label>
      </fieldset>
      <button type="submit">Save</button>
      <p id="message" role="status"></p>
      <p id="custom-bridge" hidden>
        <button type="button" id="allow-custom">Let this address use the extension</button>
        <span class="muted">Needed once for a local copy of Mawkingbird.</span>
      </p>
    </form>
    <section aria-labelledby="sites-heading">
      <h2 id="sites-heading">Sites Mawkingbird may read</h2>
      <p class="muted">
        Mawkingbird asks before reading a site's feeds or pages for you. It never
        sends your cookies.
      </p>
      <ul id="sites"></ul>
      <p id="no-sites" class="muted">None yet.</p>
    </section>
  </body>
</html>
