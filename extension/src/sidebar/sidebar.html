<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mawkingbird</title>
    <link rel="stylesheet" href="sidebar.css" />
    <script type="module" src="sidebar.js"></script>
  </head>
  <body>
    <div id="mismatch" class="mismatch" role="status" hidden>
      <p>Mawkingbird is updating, so this sidebar can't talk to it yet. This usually takes a few minutes.</p>
      <button type="button" id="retry">Try again</button>
    </div>
    <iframe
      id="panel"
      title="Mawkingbird about this page"
      allow="clipboard-write; autoplay; fullscreen"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
