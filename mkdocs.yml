---
site_name: Mawkingbird Help
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://mawkingbird.readthedocs.io/"]
site_author: Matthew Martin
site_description: Short, practical guides for using Mawkingbird.

theme:
  name: readthedocs
  features:
    - navigation.footer

markdown_extensions:
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Welcome to Mawkingbird: start/welcome.md
      - Look around without an account: start/look-around.md
      - Sign in: start/sign-in.md
      - Sign in with Mastodon: start/sign-in-mastodon.md
      - Sign in with Bluesky: start/sign-in-bluesky.md
      - Your first ten minutes: start/first-ten-minutes.md
      - A quick tour of the screen: start/screen-tour.md
  - Reading:
      - Understand your Home feed: reading/home-feed.md
  - Finding people:
      - Find people to follow: finding-people/find-people.md
  - Posting:
      - Write and publish a basic post: posting/basic-post.md
      - Choose who can see a post: posting/visibility.md
      - Reply, mention, or quote: posting/replies-mentions-quotes.md
      - Add a photo or other media: posting/media.md
      - Write useful media descriptions: posting/alt-text.md
      - Add a poll: posting/polls.md
      - Add a content warning: posting/content-warnings.md
      - Write a thread: posting/threads.md
      - Save and return to a draft: posting/drafts.md
      - Schedule a post: posting/schedule.md
      - Choose where a post is published: posting/destinations.md
      - Fix, edit, or delete a post: posting/edit-delete.md
  - Glossary: glossary.md

plugins:
  - search

validation:
  nav:
    omitted_files: warn
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
