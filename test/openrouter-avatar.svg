<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OpenRouter">
  <defs>
    <linearGradient id="or-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6a8"/>
      <stop offset="1" stop-color="#2a7d8c"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#or-bg)"/>
  <!-- A router, not a face. This is a correspondent with no persona: one input
       fanning out to several models, which is the whole idea of the service. -->
  <g fill="none" stroke="#fdfcff" stroke-width="4.5" stroke-linecap="round">
    <path d="M22 48 H40"/>
    <path d="M56 48 H74"/>
    <path d="M40 48 q8 0 8 -14 t8 -14"/>
    <path d="M40 48 q8 0 8 14 t8 14"/>
  </g>
  <circle cx="20" cy="48" r="6" fill="#fdfcff"/>
  <circle cx="76" cy="20" r="6" fill="#c4f0ea"/>
  <circle cx="76" cy="48" r="6" fill="#c4f0ea"/>
  <circle cx="76" cy="76" r="6" fill="#c4f0ea"/>
</svg>
