[package]
name = "mawkingbird-native"
version = "0.2.0"
description = "Local desktop host for the shared Mawkingbird Angular application"
edition = "2021"
publish = false

[lib]
name = "mawkingbird_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
tauri-plugin-opener = "2"
url = "2"
tokio = { version = "1", features = ["net", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
diesel = { version = "2.4", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35", "32-column-tables"] }
diesel_migrations = { version = "2.4", features = ["sqlite"] }
anyhow = "1"
keyring = "4.2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
quick-xml = "0.42"
encoding_rs = "0.8"
flate2 = "1"
atrium-oauth = { version = "0.2", default-features = false }
atrium-api = { version = "0.26", default-features = false, features = ["agent"] }
atrium-identity = "0.2"
atrium-common = "0.1.4"
atrium-xrpc = "0.12.4"
serde_html_form = "0.2"
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp", "heif"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Networking_Connectivity",
  "Storage_Streams",
] }
winreg = "0.55"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "socks"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
